name: pypi

on:
  release:
    types: [created]

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build keyring keyrings.google-artifactregistry-auth
    - name: Check consistency between the package version and release tag
      run: |
        pip install .
        RELEASE_VER=${GITHUB_REF#refs/*/}
        PACKAGE_VER="v`python -c 'import mctx; print(mctx.__version__)'`"
        if [ "$RELEASE_VER" != "$PACKAGE_VER" ]
        then
          echo "package ver. ($PACKAGE_VER) != release ver. ($RELEASE_VER)"; exit 1
        fi
    - name: Build
      run: |
        python -m build
    - name: Authenticate to OSS Exit Gate
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Stage package distributions in OSS Exit Gate Artifact Registry
      run: |
        python -m twine upload \
          --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/mctx--pypi \
          dist/*
    - name: Trigger OSS Exit Gate release
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        MANIFEST_FILE="$(mktemp)"
        echo '{"publish_all": true}' > "${MANIFEST_FILE}"
        gcloud storage cp "${MANIFEST_FILE}" \
          "gs://oss-exit-gate-prod-projects-bucket/mctx/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
        rm -f "${MANIFEST_FILE}"
